<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Mohamad Kanso — social preview source</title>
    <!--
      Source for forward-deployed-social.png (1200x630). Render with:
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
        --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=6000 \
        --screenshot=assets/preview/forward-deployed-social.png "file://$PWD/assets/preview/social-source.html"
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;family=Syne:wght@400..800&amp;display=block" rel="stylesheet">
    <style>
      :root {
        --ink: #0b0d12;
        --lime: #c8ff35;
        --white: #fffdf7;
        --muted: #9b9da5;
        --line: rgba(255, 253, 247, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(circle at 84% 18%, rgba(200, 255, 53, 0.09), transparent 34%),
          var(--ink);
        color: var(--white);
        font-family: "Syne", "Helvetica Neue", Arial, sans-serif;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .frame {
        position: absolute;
        inset: 56px 64px 48px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border: 1px solid var(--white);
        border-radius: 50%;
        font-family: "Syne", sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--white);
      }
      .main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 56px;
      }
      .name {
        margin: 0;
        font-size: 82px;
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.06em;
      }
      .role {
        margin: 26px 0 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.06em;
        color: var(--lime);
      }
      .headline {
        margin: 0;
        padding-left: 44px;
        border-left: 1px solid var(--line);
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 64px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .headline em { color: var(--lime); }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 0;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.02em;
        color: var(--white);
      }
      .stats span + span::before {
        content: "·";
        margin: 0 14px;
        color: var(--lime);
      }
      .stats b { color: var(--lime); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <span class="mark">MK</span>
        <span>mohamadkanso.github.io</span>
      </header>
      <div class="main">
        <div>
          <h1 class="name">Mohamad<br>Kanso</h1>
          <p class="role">Forward Deployed AI · 7IM</p>
        </div>
        <p class="headline">Agents that hold up in the <em>real world.</em></p>
      </div>
      <div class="stats">
        <span><b>27</b> contributions landed in Hermes Agent</span>
        <span><b>34</b> credited commits</span>
        <span>AI agent governance at 7IM</span>
        <span><b>10</b> live systems</span>
      </div>
    </div>
  </body>
</html>
